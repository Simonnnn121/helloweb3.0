<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到 iamymy.xyz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #4f46e5;
        }
        .domain {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            margin: 20px 0;
            font-size: 1.2em;
        }
        .status {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 网站准备就绪！</h1>
        <p>这是你的域名 <span class="domain" id="domain"></span> 的默认页面</p >
        
        <div class="status">
            <p><strong>状态：</strong> Vercel 部署成功</p >
            <p><strong>时间：</strong> <span id="time"></span></p >
            <p><strong>下一步：</strong> 开始定制你的网站内容</p >
        </div>
        
        <p>你可以修改这个 HTML 文件，或者添加 CSS、JavaScript 文件。</p >
        <p>所有更改推送到 GitHub 后会自动更新网站。</p >
        
        前往 GitHub 编辑
        
    </div>
    
    <script>
        document.getElementById('domain').textContent = window.location.hostname;
        document.getElementById('time').textContent = new Date().toLocaleString('zh-CN');
    </script>
</body>
</html>
