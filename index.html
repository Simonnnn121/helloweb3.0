<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网站 | 欢迎</title>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #7c3aed;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .domain {
            display: inline-block;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            margin: 20px 0;
            font-size: 1.2em;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .status-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 25px;
            margin: 30px 0;
            border-left: 5px solid #10b981;
            text-align: left;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 8px 0;
        }
        
        .status-icon {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            background: #10b981;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .next-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        
        .step {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        
        .step:hover {
            transform: translateY(-5px);
        }
        
        .step-number {
            display: inline-block;
            width: 36px;
            height: 36px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 50%;
            line-height: 36px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            margin: 10px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }
        
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        
        footer {
            margin-top: 40px;
            color: #64748b;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            .next-steps {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-rocket"></i> 网站部署成功！</h1>
        <p>恭喜！你的域名已经成功连接到GitHub并自动部署</p >
        
        <div class="domain" id="domainDisplay">
            <i class="fas fa-globe"></i> 正在加载域名...
        </div>
        
        <div class="status-card">
            <h3><i class="fas fa-check-circle"></i> 当前状态</h3>
            <div class="status-item">
                <span class="status-icon">✓</span>
                <span><strong>GitHub仓库：</strong> <span id="repoStatus">已连接</span></span>
            </div>
            <div class="status-item">
                <span class="status-icon">✓</span>
                <span><strong>自动部署：</strong> <span id="deployStatus">已启用</span></span>
            </div>
            <div class="status-item">
                <span class="status-icon">✓</span>
                <span><strong>SSL证书：</strong> <span id="sslStatus">已激活</span></span>
            </div>
            <div class="status-item">
                <span class="status-icon">📅</span>
                <span><strong>上线时间：</strong> <span id="timeDisplay"></span></span>
            </div>
        </div>
        
        <h2><i class="fas fa-list-check"></i> 下一步可以做什么？</h2>
        <div class="next-steps">
            <div class="step">
                <div class="step-number">1</div>
                <h4>编辑网站内容</h4>
                <p>修改这个HTML文件，添加你的个人介绍、项目展示等内容</p >
            </div>
            <div class="step">
                <div class="step-number">2</div>
                <h4>添加CSS样式</h4>
                <p>在style标签内修改样式，或创建单独的CSS文件</p >
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <h4>绑定域名邮箱</h4>
                <p>设置@你的域名的邮箱转发到常用邮箱</p >
            </div>
            <div class="step">
                <div class="step-number">4</div>
                <h4>优化SEO</h4>
                <p>添加meta描述、关键词等，让搜索引擎更容易找到你</p >
            </div>
        </div>
        
        <div>
            <button class="btn" onclick="editInGithub()">
                <i class="fab fa-github"></i> 在GitHub编辑
            </button>
            <button class="btn btn-secondary" onclick="viewSource()">
                <i class="fas fa-code"></i> 查看源代码
            </button>
            <button class="btn btn-secondary" onclick="refreshPage()">
                <i class="fas fa-sync-alt"></i> 刷新页面
            </button>
        </div>
        
        <footer>
            <p>🚀 自动部署服务 | 最后更新: <span id="lastUpdate"></span></p >
            <p>📧 有任何问题？修改这个文件即可更新网站！</p >
        </footer>
    </div>
    
    <script>
        // 显示当前域名
        document.getElementById('domainDisplay').innerHTML = 
            '<i class="fas fa-globe"></i> ' + window.location.hostname;
        
        // 显示时间
        const now = new Date();
        document.getElementById('timeDisplay').textContent = 
            now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN');
        
        document.getElementById('lastUpdate').textContent = 
            now.toLocaleDateString('zh-CN');
        
        // 按钮功能
        function editInGithub() {
            const repo = window.location.hostname.replace('.com', '');
            window.open('https://github.com/你的用户名/' + repo + '/edit/main/index.html', '_blank');
        }
        
        function viewSource() {
            window.open('view-source:' + window.location.href, '_blank');
        }
        
        function refreshPage() {
            window.location.reload();
        }
        
        // 检查SSL状态
        document.getElementById('sslStatus').textContent = 
            window.location.protocol === 'https:' ? '已激活 (HTTPS)' : '未激活';
        
        // 添加一些动态效果
        document.addEventListener('DOMContentLoaded', function() {
            const steps = document.querySelectorAll('.step');
            steps.forEach((step, index) => {
                setTimeout(() => {
                    step.style.opacity = '1';
                    step.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
        
        // 初始化步骤动画
        document.querySelectorAll('.step').forEach(step => {
            step.style.opacity = '0';
            step.style.transform = 'translateY(20px)';
            step.style.transition = 'opacity 0.5s, transform 0.5s';
        });
    </script>
</body>
</html>
